name: Build and release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install musl linker
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
      - name: Install Rust target
        shell: bash
        run: rustup target add "${{ matrix.target }}"
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/${{ matrix.target }}/release
          key: rust-1.94.1-${{ matrix.target }}-release-${{ hashFiles('Cargo.lock') }}
          restore-keys: rust-1.94.1-${{ matrix.target }}-release-
      - name: Check tag version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml)"
          test "$GITHUB_REF_NAME" = "v$version"
      - name: Build binary
        shell: bash
        run: cargo build --release --locked --target "${{ matrix.target }}"
      - name: Smoke-test and package
        shell: bash
        run: python scripts/package_release.py "${{ matrix.target }}"
      - uses: actions/upload-artifact@v7
        with:
          name: canvas-native-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: canvas-native-*
          merge-multiple: true
          path: dist
      - name: Verify all release assets
        run: |
          cd dist
          test "$(find . -maxdepth 1 -name '*.sha256' | wc -l)" -eq 5
          sha256sum -c ./*.sha256
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes-from-tag
