[package]
name = "canvas-render"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Render Obsidian .canvas files to SVG or PNG without Obsidian or a browser"
repository = ""

[[bin]]
name = "canvas-render"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cosmic-text = "0.12"
resvg = "0.45"

[profile.release]
opt-level = 2
strip = true
