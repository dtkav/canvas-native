[package]
name = "canvas-render"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Render JSON Canvas files to SVG or PNG without Obsidian or a browser — the renderer behind the canvas agent skill"
repository = "https://github.com/dtkav/canvas-skill"

[[bin]]
name = "canvas-render"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cosmic-text = "0.12"
resvg = "0.45"

[profile.release]
opt-level = 2
strip = true
